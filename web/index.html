<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>XRay One</title>
<link rel="stylesheet" href="style.css?v=0.8.2">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <div class="brand"><span class="dot"></span>XRay One</div>
    <p class="muted" data-t="loginHint"></p>
    <label><span data-t="user"></span><input name="user" autocomplete="username" required></label>
    <label><span data-t="pass"></span><input name="pass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary wide" data-t="signIn"></button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><span class="dot" id="coreDot"></span>XRay One <span id="panelVer" class="ver"></span></div>
    <nav id="tabs">
      <button data-view="overview" data-t="overview"></button>
      <button data-view="inbounds" data-t="inbounds"></button>
      <button data-view="users" data-t="usersTab"></button>
      <button data-view="tunnels" data-t="tunnels"></button>
      <button data-view="settings" data-t="settings"></button>
    </nav>
    <div class="top-actions">
      <button id="langBtn" class="btn ghost small">EN</button>
      <button id="logoutBtn" class="btn ghost small" data-t="logout"></button>
    </div>
  </header>

  <main>
    <div id="subBar" class="card subbar hidden">
      <div class="subbar-text">
        <div class="label" data-t="allSub"></div>
        <div id="allSubUrl" class="mono sub-url"></div>
      </div>
      <div class="actions">
        <button id="allSubCopy" class="btn small primary" data-t="copy"></button>
        <button id="allSubQr" class="btn small">QR</button>
        <button id="allSubReset" class="btn small ghost" data-t="newLink"></button>
      </div>
    </div>
    <section id="view-overview" class="view">
      <div class="grid">
        <div class="card stat"><div class="label" data-t="coreStatus"></div><div id="sStatus" class="big">—</div><div id="sService" class="muted"></div></div>
        <div class="card stat"><div class="label" data-t="coreVersion"></div><div id="sVersion" class="big">—</div><div id="sPath" class="muted mono"></div></div>
        <div class="card stat"><div class="label" data-t="clients"></div><div id="sClients" class="big">—</div><div id="sInbounds" class="muted"></div></div>
        <div class="card stat"><div class="label" data-t="traffic"></div><div id="sTraffic" class="big">—</div><div id="sApi" class="muted"></div></div>
      </div>

      <div class="card">
        <div class="row-between"><h3 data-t="liveTitle"></h3><span class="live-nums"><span class="dl">↓ <span data-t="dlLbl"></span> <b id="liveRx">—</b></span><span class="ul">↑ <span data-t="ulLbl"></span> <b id="liveTx">—</b></span></span></div>
        <canvas id="liveChart" class="livechart"></canvas>
      </div>

      <div class="card">
        <div class="row-between">
          <h3 data-t="dailyTitle"></h3>
          <span class="inrow"><span id="dMode" class="inrow"><button class="btn small" data-m="week" data-t="d7"></button><button class="btn small" data-m="month" data-t="dMonthLbl"></button></span>
            <span id="dNav" class="inrow"><button class="btn small" id="dPrev">‹</button><b id="dMonth" class="mono"></b><button class="btn small" id="dNext">›</button></span></span>
        </div>
        <p class="muted" id="dSum"></p>
        <div id="dailyChart" class="dchart"></div>
      </div>

      <div class="card">
        <div class="row-between">
          <div>
            <h3 data-t="coreTitle"></h3>
            <p class="muted" id="coreHint"></p>
          </div>
          <div class="actions">
            <input id="verInput" class="small-input" placeholder="latest">
            <button id="installBtn" class="btn primary"></button>
            <button id="restartBtn" class="btn" data-t="restart"></button>
            <button id="apiBtn" class="btn hidden" data-t="enableApi"></button>
          </div>
        </div>
        <pre id="jobLog" class="log hidden"></pre>
      </div>
    </section>

    <section id="view-inbounds" class="view hidden">
      <div class="row-between head">
        <h2 data-t="inbounds"></h2>
        <div class="actions">
          <label class="selall"><input type="checkbox" id="selAll"><span data-t="selectAll"></span></label>
          <span id="selActs" class="actions hidden">
            <button id="relaySelBtn" class="btn" disabled></button>
            <button id="tunSelBtn" class="btn" disabled></button>
            <button id="delSelBtn" class="btn danger" disabled></button>
          </span>
          <button id="quickBtn" class="btn" data-t="quick"></button>
          <button id="addInboundBtn" class="btn primary" data-t="addInbound"></button>
        </div>
      </div>
      <div id="inboundList" class="stack"></div>
    </section>

    <section id="view-users" class="view hidden">
      <div class="row-between head">
        <h2 data-t="usersTab"></h2>
        <div class="actions"><button id="addUserBtn" class="btn primary" data-t="addUser"></button></div>
      </div>
      <p class="muted" data-t="usersHint"></p>
      <div id="userList" class="stack"></div>
    </section>

    <section id="view-tunnels" class="view hidden">
      <div class="row-between head">
        <h2 data-t="tunnels"></h2>
        <div class="actions"><button id="addTunnelBtn" class="btn primary" data-t="addTunnel"></button></div>
      </div>
      <p id="tunnelInfo" class="muted"></p>
      <form id="tunnelPorts" class="tports"></form>
      <div id="rcOut" class="rcout hidden"></div>
      <form id="dtPorts" class="tports"></form>
      <div id="tunnelList" class="stack"></div>
    </section>

    <section id="view-settings" class="view hidden">
      <div class="card">
        <h3 data-t="linksTitle"></h3>
        <form id="settingsForm" class="form">
          <label><span data-t="publicHost"></span><input name="publicHost" placeholder="example.com"></label>
          <label><span data-t="subBase"></span><input name="subBase" placeholder="https://sub.example.com:2096/secret"></label>
          <button class="btn primary" data-t="save"></button>
        </form>
        <p class="muted" data-t="sslHint"></p>
      </div>
      <div class="card">
        <h3 data-t="backups"></h3>
        <div id="backupList" class="list"></div>
      </div>
      <div class="card">
        <div class="row-between"><h3 data-t="rawConfig"></h3><button id="loadRaw" class="btn small" data-t="show"></button></div>
        <pre id="rawConfig" class="log hidden"></pre>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="card modal-card" id="modalBody"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js?v=0.8.2"></script>
</body>
</html>
